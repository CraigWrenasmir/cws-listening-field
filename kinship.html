<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Kinship — the connected piano works of The Listening Field.">
<title>Kinship · The Listening Field</title>
<link rel="stylesheet" href="src/styles.css">
<link rel="stylesheet" href="src/kinship.css">
<script type="module" src="src/kinship.js"></script>
</head>
<body>
<main id="cws-kinship">
<header class="kf-header"><a href="index.html">The Listening <em>Field</em></a><h1>Kinship</h1><span id="kf-count" aria-live="polite"></span></header>
<section class="kf-map-shell" aria-label="Musical kinship map">
<svg id="kf-map" viewBox="0 0 1200 780" aria-labelledby="kf-title kf-description"><title id="kf-title">Kinship of all piano studies</title><desc id="kf-description">Every point opens a piano study. Lines join each study to its musical parent. Zoom or drag to explore; All restores the complete collection.</desc><g id="kf-world"><g id="kf-connections" fill="none" aria-hidden="true"></g><g id="kf-works"></g></g></svg>
<div class="kf-zoom" role="group" aria-label="Map view"><button id="kf-zoom-out" type="button" aria-label="Zoom out">−</button><button id="kf-fit" type="button" aria-label="Show all works">All</button><button id="kf-zoom-in" type="button" aria-label="Zoom in">+</button></div>
<p id="kf-error" role="alert" hidden>The kinship map could not load. Please reload.</p>
<noscript><p class="kf-noscript"><a href="downloads/index.html">Collected scores</a></p></noscript>
</section>
<footer class="kf-footer"><a id="kf-selected" hidden></a><span id="kf-range"></span><span id="kf-status" class="lf-sr-only" aria-live="polite"></span></footer>
</main>
</body>
</html>
